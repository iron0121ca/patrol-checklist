<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patrol Checklist · The Regency</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --primary: #1a56db;
            --primary-light: #e8effd;
            --success: #059669;
            --danger: #dc2626;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: var(--gray-900);
        }
        .auth-page {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
        }
        .auth-card {
            width: min(420px, 100%); background: white; border-radius: 12px; padding: 32px; box-shadow: var(--shadow);
        }
        .auth-card h1 { text-align: center; font-size: 30px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: var(--gray-500); margin-bottom: 24px; }
        .logo { text-align: center; margin-bottom: 12px; font-size: 42px; }
        .auth-error {
            display: none; background: #fee2e2; color: var(--danger); padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px;
        }
        .auth-card label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--gray-700); }
        .auth-card input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px; margin-bottom: 14px; font-size: 15px;
        }
        .auth-card input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--gray-300); background: white; color: var(--gray-700); }
        .btn-sm { padding: 7px 12px; font-size: 13px; }
        .btn-block { width: 100%; }
        .help-text { margin-top: 16px; text-align: center; font-size: 13px; color: var(--gray-500); }

        .app { display: none; }
        .app-header {
            position: sticky; top: 0; z-index: 20; background: white; border-bottom: 1px solid var(--gray-200); padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { font-weight: 800; color: var(--primary); font-size: 18px; }
        .brand small { font-weight: 600; color: var(--gray-500); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .name { font-weight: 700; }
        .role-badge {
            display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 700;
        }
        .role-badge.admin { background: #fef3c7; color: #92400e; }
        .main-content { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
        .page { display: none; }
        .page.active { display: block; }

        .simple-page { background: #f3f4f6; padding: 16px 0; }
        .simple-form { background: white; border-radius: 14px; box-shadow: var(--shadow); padding: 24px; }
        .simple-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .simple-header h1 { font-size: clamp(26px, 3vw, 36px); margin: 0; }
        .print-btn, .save-btn, .clear-btn {
            border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer;
        }
        .print-btn { background: #e5e7eb; color: var(--gray-700); }
        .save-btn { background: var(--primary); color: white; }
        .clear-btn { background: #f3f4f6; color: var(--gray-700); }
        .meta-row { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 14px; font-weight: 700; color: var(--gray-700); }
        .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 15px; }
        .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .patrol-table { width: 100%; border-collapse: collapse; margin-bottom: 22px; table-layout: fixed; }
        .patrol-table th, .patrol-table td { border: 1px solid var(--gray-300); padding: 10px 12px; text-align: left; vertical-align: top; }
        .patrol-table th { background: #f9fafb; color: var(--gray-700); font-size: 14px; }
        .patrol-table td { background: white; }
        .area-col { width: 22%; }
        .obs-col, .action-col, .sig-col { width: 26%; }
        .area-list { display: flex; flex-direction: column; gap: 8px; }
        .area-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .area-item input { width: 16px; height: 16px; accent-color: var(--primary); }
        textarea, .signature-input { width: 100%; min-height: 68px; border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px; resize: vertical; font: inherit; }
        .signature-input { min-height: 44px; }
        .footer-row { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; margin-bottom: 18px; }
        .footer-row label { font-size: 15px; font-weight: 700; }
        .actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
        .status { min-height: 22px; margin-top: 14px; color: var(--primary); font-weight: 700; }

        .admin-section { background: white; border-radius: 14px; box-shadow: var(--shadow); padding: 22px; margin-top: 16px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
        .admin-header h3 { font-size: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { border-bottom: 1px solid var(--gray-200); padding: 10px; text-align: left; }
        .admin-table th { color: var(--gray-500); font-size: 13px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(17, 24, 39, 0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
        }
        .modal-overlay.show { display: flex; }
        .modal-card { width: min(520px, 100%); background: white; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
        .modal-card h2 { margin-bottom: 16px; }
        .modal-card label { display: block; margin-bottom: 6px; font-weight: 700; color: var(--gray-700); }
        .modal-card input, .modal-card select { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px; margin-bottom: 12px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .toast {
            position: fixed; right: 24px; bottom: 24px; background: var(--primary); color: white; padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow); display: none; font-weight: 600; z-index: 60;
        }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }

        @media (max-width: 768px) {
            .meta-row, .footer-row { grid-template-columns: 1fr; }
            .patrol-table, .patrol-table thead, .patrol-table tbody, .patrol-table th, .patrol-table td, .patrol-table tr { display: block; width: 100%; }
            .patrol-table thead { display: none; }
            .patrol-table tr { border: 1px solid var(--gray-300); border-radius: 10px; margin-bottom: 12px; padding: 8px; background: white; }
            .patrol-table td { border: none; border-bottom: 1px solid var(--gray-200); }
            .patrol-table td:last-child { border-bottom: none; }
            .app-header { padding: 10px 16px; }
            .user-info { gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="authPage" class="auth-page">
        <div class="auth-card">
            <div class="logo">🏢</div>
            <h1>Patrol Checklist</h1>
            <p class="subtitle">The Regency · 701 7995 Westminster</p>
            <div id="authError" class="auth-error"></div>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" placeholder="caretaker@example.com" required />
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="••••••••" required />
                <button class="btn btn-primary btn-block" type="submit">Login</button>
            </form>
            <p class="help-text">Contact admin to get an account</p>
        </div>
    </div>

    <div id="app" class="app">
        <header class="app-header">
            <div class="brand">🏢 Patrol <small>· The Regency</small></div>
            <div class="user-info">
                <span class="name" id="displayName"></span>
                <span class="role-badge" id="roleBadge">Caretaker</span>
                <button id="adminBtn" class="btn btn-outline btn-sm" type="button" style="display:none;">⚙️ Admin</button>
                <button class="btn btn-outline btn-sm" type="button" onclick="handleLogout()">Logout</button>
            </div>
        </header>

        <main class="main-content">
            <div id="pagePatrol" class="page active">
                <div class="simple-page">
                    <div class="simple-form">
                        <div class="simple-header">
                            <h1>Daily Patrolling check list</h1>
                            <button type="button" class="print-btn" onclick="window.print()">Print</button>
                        </div>

                        <div class="meta-row">
                            <div class="field">
                                <label for="patrolDate">Date</label>
                                <input id="patrolDate" type="date" />
                            </div>
                            <div class="field">
                                <label for="caretakerName">Security or Caretaker Name</label>
                                <input id="caretakerName" type="text" placeholder="Enter name" />
                            </div>
                        </div>

                        <table class="patrol-table">
                            <thead>
                                <tr>
                                    <th class="area-col">Patrol Area(s)</th>
                                    <th class="obs-col">Observation / Incident</th>
                                    <th class="action-col">Action Taken</th>
                                    <th class="sig-col">Signature</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="area-col">
                                        <div class="area-list">
                                            <label class="area-item"><input type="checkbox" /> Garbage Area</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P1</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P2</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P3</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P4</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P5</label>
                                            <label class="area-item"><input type="checkbox" /> Parkade-P6</label>
                                            <label class="area-item"><input type="checkbox" /> Other</label>
                                        </div>
                                    </td>
                                    <td class="obs-col"><textarea placeholder="Observation / Incident"></textarea></td>
                                    <td class="action-col"><textarea placeholder="Action Taken"></textarea></td>
                                    <td class="sig-col"><input class="signature-input" type="text" placeholder="Signature" /></td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="footer-row">
                            <label for="finalSignature">Signature</label>
                            <input id="finalSignature" class="signature-input" type="text" placeholder="Signature" />
                        </div>

                        <div class="actions">
                            <button type="button" class="clear-btn" id="clearBtn">Clear</button>
                            <button type="button" class="save-btn" id="saveBtn">Save Patrol</button>
                        </div>

                        <p id="status" class="status" aria-live="polite"></p>
                    </div>
                </div>
            </div>

            <div id="pageAdmin" class="page">
                <div class="admin-section">
                    <div class="admin-header">
                        <h3>👤 Caretaker Management</h3>
                        <button type="button" class="btn btn-primary btn-sm" id="addUserBtn">+ Add Caretaker</button>
                    </div>
                    <div id="usersList">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Add Caretaker</h2>
            <form id="modalForm">
                <label>Email</label>
                <input type="email" id="modalEmail" required />
                <label>Display Name</label>
                <input type="text" id="modalDisplayName" required />
                <label>Password</label>
                <input type="password" id="modalPassword" placeholder="Password" required />
                <label>Role</label>
                <select id="modalRole">
                    <option value="caretaker">Caretaker</option>
                    <option value="admin">Admin</option>
                </select>
                <input type="hidden" id="modalUserId" />
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                await handleLogin(email, password);
            });
            document.getElementById('adminBtn').addEventListener('click', () => switchPage('admin'));
            document.getElementById('addUserBtn').addEventListener('click', showAddUserModal);
            document.getElementById('modalForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await handleSaveUser();
            });
            document.getElementById('modalOverlay').addEventListener('click', (event) => {
                if (event.target === document.getElementById('modalOverlay')) closeModal();
            });

            document.getElementById('saveBtn').addEventListener('click', savePatrol);
            document.getElementById('clearBtn').addEventListener('click', clearForm);
            restorePatrol();
            await checkSession();
        });

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user) {
                await loadUserProfile(session.user);
            } else {
                showAuth();
            }
        }

        async function loadUserProfile(user) {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error || !profile) {
                console.error('Profile load error:', error);
                showAuth();
                return;
            }

            currentUser = { ...user, profile };
            document.getElementById('displayName').textContent = profile.display_name || profile.username || user.email;
            document.getElementById('roleBadge').textContent = profile.role === 'admin' ? 'Admin' : 'Caretaker';
            document.getElementById('roleBadge').classList.toggle('admin', profile.role === 'admin');
            document.getElementById('adminBtn').style.display = profile.role === 'admin' ? '' : 'none';
            showApp();

            if (profile.role === 'admin') {
                await loadUsersList();
            }
        }

        async function handleLogin(email, password) {
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    const errorBox = document.getElementById('authError');
                    errorBox.textContent = error.message || 'Login failed';
                    errorBox.style.display = 'block';
                    return;
                }
                document.getElementById('authError').style.display = 'none';
                await loadUserProfile(data.user);
            } catch (error) {
                const errorBox = document.getElementById('authError');
                errorBox.textContent = 'Login failed. Please check your email and password.';
                errorBox.style.display = 'block';
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            showAuth();
        }

        function showAuth() {
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        function switchPage(page) {
            const pages = ['pagePatrol', 'pageAdmin'];
            pages.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id === (page === 'admin' ? 'pageAdmin' : 'pagePatrol'));
            });
        }

        async function loadUsersList() {
            const container = document.getElementById('usersList');
            const { data: users, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: true });
            if (error) {
                container.innerHTML = '<div class="empty-state">Failed to load users.</div>';
                return;
            }

            if (!users || users.length === 0) {
                container.innerHTML = '<div class="empty-state">No users found.</div>';
                return;
            }

            const rows = users.map(user => `
                <tr>
                    <td>${user.username || '-'}</td>
                    <td>${user.display_name || '-'}</td>
                    <td>${user.role}</td>
                    <td>${user.is_active ? 'Active' : 'Disabled'}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Display Name</th>
                            <th>Role</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function showAddUserModal() {
            document.getElementById('modalTitle').textContent = 'Add Caretaker';
            document.getElementById('modalUserId').value = '';
            document.getElementById('modalEmail').value = '';
            document.getElementById('modalDisplayName').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalPassword').placeholder = 'Password';
            document.getElementById('modalRole').value = 'caretaker';
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        async function handleSaveUser() {
            const email = document.getElementById('modalEmail').value.trim();
            const displayName = document.getElementById('modalDisplayName').value.trim();
            const password = document.getElementById('modalPassword').value;
            const role = document.getElementById('modalRole').value;

            if (!email || !displayName || !password) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            try {
                const { error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            display_name: displayName,
                            role
                        }
                    }
                });
                if (error) throw error;
                closeModal();
                showToast('User created successfully.', 'success');
                if (currentUser?.profile?.role === 'admin') await loadUsersList();
            } catch (error) {
                showToast(error.message || 'Failed to create user.', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        const localStorageKey = 'daily-patrol-checklist';
        function setStatus(message, isError = false) {
            const statusText = document.getElementById('status');
            statusText.textContent = message;
            statusText.style.color = isError ? '#dc2626' : '#2563eb';
        }

        function getFormData() {
            const selectedAreas = Array.from(document.querySelectorAll('.area-item input')).filter(item => item.checked).map(item => item.parentElement.textContent.trim());
            return {
                date: document.getElementById('patrolDate').value,
                name: document.getElementById('caretakerName').value.trim(),
                selectedAreas,
                observation: document.querySelectorAll('.patrol-table textarea')[0].value.trim(),
                actionTaken: document.querySelectorAll('.patrol-table textarea')[1].value.trim(),
                signature: document.getElementById('finalSignature').value.trim(),
                savedAt: new Date().toISOString()
            };
        }

        function savePatrol() {
            const data = getFormData();
            if (!data.date) {
                setStatus('Please select a date.', true);
                return;
            }
            if (!data.name) {
                setStatus('Please enter the security or caretaker name.', true);
                return;
            }
            localStorage.setItem(localStorageKey, JSON.stringify(data));
            setStatus('Patrol saved successfully.');
        }

        function restorePatrol() {
            const saved = localStorage.getItem(localStorageKey);
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                if (!data) return;
                if (data.date) document.getElementById('patrolDate').value = data.date;
                if (data.name) document.getElementById('caretakerName').value = data.name;
                if (data.signature) document.getElementById('finalSignature').value = data.signature;
                Array.from(document.querySelectorAll('.area-item input')).forEach(input => {
                    const labelText = input.parentElement.textContent.trim();
                    input.checked = Array.isArray(data.selectedAreas) && data.selectedAreas.includes(labelText);
                });
                const textareas = document.querySelectorAll('.patrol-table textarea');
                if (textareas[0] && data.observation) textareas[0].value = data.observation;
                if (textareas[1] && data.actionTaken) textareas[1].value = data.actionTaken;
                setStatus('Previous patrol record restored.');
            } catch (e) {
                console.error('Failed to restore patrol', e);
            }
        }

        function clearForm() {
            document.getElementById('patrolDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('caretakerName').value = '';
            document.getElementById('finalSignature').value = '';
            document.querySelectorAll('.area-item input').forEach(item => item.checked = false);
            document.querySelectorAll('.patrol-table textarea').forEach(item => item.value = '');
            localStorage.removeItem(localStorageKey);
            setStatus('Form cleared.');
        }
    </script>
</body>
</html>
